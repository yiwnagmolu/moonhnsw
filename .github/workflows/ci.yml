name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Require moonc 0.10.16 or newer
        run: |
          python3 - <<'PY'
          import re
          import subprocess

          version = subprocess.check_output(["moonc", "-v"], text=True).strip()
          match = re.search(r"v(\d+)\.(\d+)\.(\d+)", version)
          if match is None or tuple(map(int, match.groups())) < (0, 10, 16):
              raise SystemExit(f"moonc >= 0.10.16 required; found: {version}")
          print(version)
          PY

      - name: Check formatting
        run: moon fmt --check

      - name: Check MoonBit code
        run: moon check --target wasm-gc --deny-warn

      - name: Check benchmark launcher syntax
        run: node --check benchmarks/real/run.cjs

      - name: Test (wasm-gc)
        run: moon test --target wasm-gc

      - name: Test (js)
        run: moon test --target js

      - name: Test (native)
        run: moon test --target native

      - name: Build (wasm)
        run: moon build --target wasm

      - name: Build documentation
        run: moon doc

      - name: Benchmark smoke run
        run: moon run --target wasm-gc examples/benchmark
