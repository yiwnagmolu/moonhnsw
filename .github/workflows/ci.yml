name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '27 2 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: Verify (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install MoonBit toolchain
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Record toolchain and require moonc 0.10.20 or newer
        run: |
          moon version --all
          python3 - <<'PY'
          import re
          import subprocess

          version = subprocess.check_output(["moonc", "-v"], text=True).strip()
          match = re.search(r"v(\d+)\.(\d+)\.(\d+)", version)
          if match is None or tuple(map(int, match.groups())) < (0, 10, 20):
              raise SystemExit(f"moonc >= 0.10.20 required; found: {version}")
          PY

      - name: Check formatting
        if: matrix.target == 'wasm-gc'
        run: moon fmt --check

      - name: Check MoonBit code
        run: moon check --target ${{ matrix.target }} --deny-warn

      - name: Check benchmark launcher syntax
        if: matrix.target == 'wasm-gc'
        run: node --check benchmarks/real/run.cjs

      - name: Build
        run: moon build --target ${{ matrix.target }}

      - name: Test
        run: moon test --target ${{ matrix.target }}

      - name: Test native release
        if: matrix.target == 'native'
        run: moon test --target native --release

      - name: Build documentation
        if: matrix.target == 'wasm-gc'
        run: moon doc

      - name: Benchmark smoke run
        if: matrix.target == 'wasm-gc'
        run: moon run --target wasm-gc examples/benchmark
